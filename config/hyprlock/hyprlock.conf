# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

# BACKGROUND
# Uses your actual desktop wallpaper with a subtle blur so the
# screen still feels "yours" while locked.
background {
    monitor =
    path = screenshot          # grabs current screen; swap for a path like ~/Pictures/wall.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = "Hi, $USER"
    color = rgba(255, 255, 255, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 16
    check_color = rgba(150, 220, 150, 0.9)
    fail_color = rgba(220, 120, 120, 0.9)
    fail_text = <i>Wrong password</i>
    position = 0, -70
    halign = center
    valign = center
}